name: Build AnatoMate iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: https://gwwauaybbqmzbwvpbxly.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Iw4ogv0H0YgGA3sehrjjw_bjWcBcgS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS simulator app
        run: |
          xcodebuild             -workspace ios/App/App.xcworkspace             -scheme App             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: AnatoMate-iOS-Xcode-project
          path: ios
          if-no-files-found: error
