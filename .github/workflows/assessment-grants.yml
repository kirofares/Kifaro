name: Assessment database grants
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/assessment-grants-*.sql'
      - 'scripts/test-assessment-grants.sh'
      - '.github/workflows/assessment-grants.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/assessment-grants-*.sql'
      - 'scripts/test-assessment-grants.sh'
      - '.github/workflows/assessment-grants.yml'
permissions:
  contents: read
jobs:
  roles:
    name: PostgreSQL ${{ matrix.postgres }} / ${{ matrix.mode == 'replay' && 'known-blocker diagnostic' || matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '17']
        mode: [fresh, legacy, replay]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: kifaro_grants_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: kifaro_grants_test
      PGUSER: postgres
      PGPASSWORD: local-fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run role tests or known-blocker replay diagnostic
        run: bash scripts/test-assessment-grants.sh '${{ matrix.mode }}'
