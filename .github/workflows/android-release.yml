name: Build AnatoMate Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gwwauaybbqmzbwvpbxly.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Iw4ogv0H0YgGA3sehrjjw_bjWcBcgS
      ANATOMATE_VERSION_NAME: 1.0.0
      ANATOMATE_VERSION_CODE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Disable stale PWA cache in native app
        shell: bash
        run: |
          true

      - name: Apply Android system-bar insets
        shell: bash
        run: |
          cat > android/app/src/main/java/com/kifaro/anatomate/MainActivity.java <<'EOF'
          package com.kifaro.anatomate;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (view, insets) -> {
                Insets nav = insets.getInsets(WindowInsetsCompat.Type.navigationBars());
                view.setPadding(
                  view.getPaddingLeft(),
                  view.getPaddingTop(),
                  view.getPaddingRight(),
                  nav.bottom
                );
                return insets;
              });
              ViewCompat.requestApplyInsets(content);
            }
          }
          EOF

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/anatomate-release.jks

      - name: Validate keystore password and alias
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore android/app/anatomate-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Configure Android release signing and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          s = re.sub(r'versionCode\s+\d+', f'versionCode {os.environ["ANATOMATE_VERSION_CODE"]}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "{os.environ["ANATOMATE_VERSION_NAME"]}"', s)

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("anatomate-release.jks")
                      storePassword project.findProperty("ANATOMATE_STORE_PASSWORD")
                      keyAlias project.findProperty("ANATOMATE_KEY_ALIAS")
                      keyPassword project.findProperty("ANATOMATE_KEY_PASSWORD")
                  }
              }

          """

          build_types_marker = re.search(r'^\s*buildTypes\s*\{', s, flags=re.MULTILINE)
          if not build_types_marker:
              raise SystemExit("Could not find buildTypes block in android/app/build.gradle")

          s = s[:build_types_marker.start()] + signing_block + s[build_types_marker.start():]

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          replacement = r'\1\n            signingConfig signingConfigs.release'
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit("Could not configure release signing in buildTypes.release")

          p.write_text(s)
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ANATOMATE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ANATOMATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ANATOMATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify signed APK
        run: jarsigner -verify -verbose -certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AnatoMate.apk
          cp android/app/build/outputs/bundle/release/app-release.aab AnatoMate.aab

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AnatoMate-1.0.0-release-apk
          path: AnatoMate.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AnatoMate-1.0.0-release-aab
          path: AnatoMate.aab
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AnatoMate 1.0.0
          body: |
            AnatoMate by KIFARO — Android release 1.0.0.
            APK: direct installation.
            AAB: Google Play submission.
          files: |
            AnatoMate.apk
            AnatoMate.aab
          make_latest: true
