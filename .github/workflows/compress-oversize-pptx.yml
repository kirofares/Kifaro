name: Compress and restore oversized PPTX assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compress-oversize-pptx.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - import_id: "7522bec4-40c5-4d0d-b744-de3b2496aa14"
            filename: "Y1_02_Introduction_to_Skeleton.pptx"
          - import_id: "7e118a39-99b8-4544-b033-e39e7c5a2693"
            filename: "Y1_04_Muscles_Myology.pptx"
          - import_id: "ec52e3fe-daad-405f-b33a-6fe7ba3051f0"
            filename: "Y1_09_Skin_Integumentary_System.pptx"
          - import_id: "6290e341-6083-4a18-a0d4-9ccd1614a114"
            filename: "Y1_M0_How_to_Study_Anatomy.pptx"
          - import_id: "f441d671-7316-4629-b679-0d6cc994eda3"
            filename: "Y2_30_Development_of_CNS.pptx"
          - import_id: "562e59ff-5fb5-482a-897b-100a1edf1575"
            filename: "Y2_31_Meninges.pptx"
          - import_id: "15662ee8-4e6e-4166-803d-2ab0e826eaff"
            filename: "Y2_32_Ventricular_System_CSF.pptx"
          - import_id: "b84e534d-02cb-4f3f-9a9b-8df96e3b9d54"
            filename: "Y2_33_Spinal_Cord_External.pptx"
          - import_id: "1635cfc0-6d06-4b61-b96a-45b30778bc7a"
            filename: "Y3_A02_Anterior_Abdominal_Wall.pptx"
          - import_id: "e74a3bb8-e1e2-4805-b13c-29e202aa0838"
            filename: "Y3_A03_Inguinal_Canal.pptx"
          - import_id: "c0c4865c-d895-45af-b312-0528b7cc9f27"
            filename: "Y3_A04_Inguinal_Hernias.pptx"
          - import_id: "81b07f5b-2273-4a06-905b-ab242be131bc"
            filename: "Y3_A09_Abdominal_Esophagus.pptx"
          - import_id: "c0197c2c-cd0c-43fa-890a-1b34d7f01675"
            filename: "Y3_A10_Stomach.pptx"
          - import_id: "20b92d8c-7539-4fb1-b56a-a1096de884d7"
            filename: "Y3_A13_Cecum_Appendix.pptx"
          - import_id: "589fb59b-7e02-47c5-a3a6-36b03eee40d6"
            filename: "Y3_HN01_Oral_Cavity.pptx"
          - import_id: "267b88de-45ac-4028-807b-b07959d19cd8"
            filename: "Y3_HN02_Palate.pptx"
          - import_id: "3830db95-c9fe-492d-ab1c-15fda30d4963"
            filename: "Y3_HN03_Tongue.pptx"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: npm install --silent @supabase/supabase-js@2

      - name: Download source PowerPoint from KIFARO Student Library
        env:
          FILE_NAME: ${{ matrix.filename }}
        run: |
          curl -L --fail --show-error --silent --max-time 600             "https://www.dropbox.com/scl/fo/7716uzv5l9jcoktktcxxx/AIhH7i76Iuy4mgEVLg0LcYc?rlkey=ffpidubd9g6nuucbkg5sc2m4e&preview=${FILE_NAME}&dl=1"             -o input.pptx
          test -s input.pptx
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('input.pptx'), 'Dropbox did not return a valid PPTX file'
          PY

      - name: Compress embedded images while preserving PPTX structure
        run: |
          cat > /tmp/compress_pptx.py <<'PY'
          import os, sys, tempfile, shutil, zipfile
          from PIL import Image

          src='input.pptx'
          target=47_000_000
          presets=[
              (1800,82,256),
              (1600,76,256),
              (1400,70,192),
              (1200,65,128),
              (1000,60,96),
          ]

          def compress_once(maxdim, quality, colors, out):
              root=tempfile.mkdtemp(prefix='pptx-')
              try:
                  with zipfile.ZipFile(src,'r') as z:
                      z.extractall(root)
                  media=os.path.join(root,'ppt','media')
                  if os.path.isdir(media):
                      for name in os.listdir(media):
                          path=os.path.join(media,name)
                          ext=os.path.splitext(name)[1].lower()
                          if ext not in ('.jpg','.jpeg','.png'):
                              continue
                          try:
                              with Image.open(path) as im:
                                  im.load()
                                  w,h=im.size
                                  scale=min(1.0, maxdim/max(w,h))
                                  if scale < 1.0:
                                      im=im.resize((max(1,int(w*scale)),max(1,int(h*scale))),Image.Resampling.LANCZOS)
                                  if ext in ('.jpg','.jpeg'):
                                      if im.mode not in ('RGB','L'):
                                          im=im.convert('RGB')
                                      im.save(path,format='JPEG',quality=quality,optimize=True,progressive=True)
                                  else:
                                      if im.mode in ('RGBA','LA'):
                                          im=im.convert('RGBA').quantize(colors=colors,method=Image.Quantize.FASTOCTREE,dither=Image.Dither.NONE)
                                      elif im.mode not in ('P','L'):
                                          im=im.convert('RGB').quantize(colors=colors,method=Image.Quantize.MEDIANCUT,dither=Image.Dither.NONE)
                                      im.save(path,format='PNG',optimize=True,compress_level=9)
                          except Exception:
                              pass
                  with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                      for base,_,files in os.walk(root):
                          for fn in files:
                              full=os.path.join(base,fn)
                              arc=os.path.relpath(full,root)
                              z.write(full,arc)
              finally:
                  shutil.rmtree(root,ignore_errors=True)

          original=os.path.getsize(src)
          print('original_bytes',original)
          for i,(maxdim,q,colors) in enumerate(presets,1):
              out=f'output-{i}.pptx'
              compress_once(maxdim,q,colors,out)
              size=os.path.getsize(out)
              print('attempt',i,'maxdim',maxdim,'quality',q,'colors',colors,'bytes',size)
              if size <= target:
                  shutil.move(out,'output.pptx')
                  sys.exit(0)
          print('Could not reduce PowerPoint below upload limit',file=sys.stderr)
          sys.exit(2)
          PY
          python /tmp/compress_pptx.py
          test $(stat -c%s output.pptx) -le 47000000
          python - <<'PY'
          import zipfile
          assert zipfile.is_zipfile('output.pptx'), 'Compressed file is not a valid PPTX archive'
          PY

      - name: Create short-lived signed upload token
        run: |
          curl --fail --show-error --silent --max-time 60             "https://gwwauaybbqmzbwvpbxly.supabase.co/functions/v1/asset-import-bridge?action=prepare&id=${{ matrix.import_id }}"             -o prep.json
          python -c "import json; d=json.load(open('prep.json')); assert d.get('token') and d.get('path')"

      - name: Upload compressed PPTX to private storage
        env:
          SUPABASE_URL: https://gwwauaybbqmzbwvpbxly.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Iw4ogv0H0YgGA3sehrjjw_bjWcBcgS
        run: |
          cat > upload.mjs <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'
          const prep=JSON.parse(fs.readFileSync('prep.json','utf8'))
          const body=fs.readFileSync('output.pptx')
          const client=createClient(process.env.SUPABASE_URL,process.env.SUPABASE_PUBLISHABLE_KEY,{
            auth:{persistSession:false,autoRefreshToken:false},
            realtime:{params:{eventsPerSecond:1}},
          })
          const { error }=await client.storage
            .from(prep.bucket)
            .uploadToSignedUrl(prep.path,prep.token,body,{contentType:prep.contentType,upsert:true})
          if(error) throw error
          console.log('uploaded_bytes',body.length)
          NODE
          node upload.mjs

      - name: Finalize lecture asset mapping
        run: |
          curl --fail --show-error --silent --max-time 60             "https://gwwauaybbqmzbwvpbxly.supabase.co/functions/v1/asset-import-bridge?action=finish&id=${{ matrix.import_id }}"
