name: KIFARO CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # October 2026 security release; update the assertion with future pins.
          node-version: '22.23.4'
      - name: Verify patched Node runtime
        run: |
          node --version
          node -e "require('node:assert/strict').equal(process.versions.node, '22.23.4')"
      - run: npm ci
      - run: npm run test:guardian
      - run: npm run test:auth
      - run: npm run test:viva
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
