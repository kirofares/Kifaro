name: Build AnatoMate Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://gwwauaybbqmzbwvpbxly.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Iw4ogv0H0YgGA3sehrjjw_bjWcBcgS
      # Shows the Paymob sandbox notice at checkout; set to 'false' when live payments are enabled.
      VITE_PAYMOB_TEST_MODE: 'true'
      VITE_APP_VERSION: '1.0.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Harden Android WebView and app window
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = re.sub(r'<application\\b', '<application android:usesCleartextTraffic="false" android:allowBackup="false"', s, count=1)
          manifest.write_text(s)
          PY
          cat > android/app/src/main/java/com/kifaro/anatomate/MainActivity.java <<'EOF'
          package com.kifaro.anatomate;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
            }
          }
          EOF

      - name: Apply KIFARO launcher icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/kifaro_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
            <path android:fillColor="#0A3C72" android:pathData="M132,137 L180,151 L180,365 L132,350 Z"/>
            <path android:fillColor="#168DE4" android:pathData="M154,113 L213,140 L213,372 L154,345 Z"/>
            <path android:fillColor="#24B7EF" android:pathData="M188,91 C232,112 249,153 249,193 L249,366 L188,343 Z"/>
            <path android:fillColor="#1AA6EB" android:pathData="M223,320 C217,260 226,226 253,194 L335,91 L405,91 L302,221 C286,242 271,260 260,282 Z"/>
            <path android:fillColor="#082D5C" android:pathData="M260,226 C290,205 317,210 342,231 L414,308 C430,325 446,343 461,361 L369,361 L272,265 C253,247 250,237 260,226 Z"/>
            <path android:fillColor="#28B8EE" android:pathData="M205,336 C205,294 208,254 223,223 C232,204 243,190 257,176 C250,223 251,269 260,307 L230,365 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/values/kifaro_icon_colors.xml <<'EOF'
          <resources>
            <color name="kifaro_launcher_background">#FBF8F5</color>
          </resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/kifaro_launcher_background"/>
            <foreground android:drawable="@drawable/kifaro_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/kifaro_launcher_background"/>
            <foreground android:drawable="@drawable/kifaro_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Apply Android system-bar insets
        shell: bash
        run: |
          cat > android/app/src/main/java/com/kifaro/anatomate/MainActivity.java <<'EOF'
          package com.kifaro.anatomate;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // Prevent ordinary screenshots and screen recording inside the Android app.
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);

              View content = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(content, (view, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                view.setPadding(
                  view.getPaddingLeft(),
                  bars.top,
                  view.getPaddingRight(),
                  bars.bottom
                );
                return insets;
              });
              ViewCompat.requestApplyInsets(content);
            }
          }
          EOF

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnatoMate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
