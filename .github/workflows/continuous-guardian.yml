name: KIFARO Continuous Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          # October 2026 security release; update the assertion with future pins.
          node-version: '22.23.4'

      - name: Verify patched Node runtime
        id: node_runtime
        run: |
          node --version
          node -e "require('node:assert/strict').equal(process.versions.node, '22.23.4')"

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Regression tests
        run: |
          npm run test:guardian
          npm run test:viva

      - name: TypeScript and production build
        run: |
          npm run typecheck
          npm run build

      - name: Dependency vulnerability assessment
        if: ${{ always() && steps.node_runtime.outcome == 'success' }}
        run: |
          npm audit --omit=dev --audit-level=high --json > guardian-audit-raw.json || true
          node scripts/guardian/summarize-audit.mjs

      - name: Live site and asset monitoring
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/guardian/check-site.mjs

      - name: Publish findings to one reusable GitHub issue per category
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const categories = [
              {
                filename: 'guardian-audit-result.json',
                title: '[Guardian] Dependency security',
                label: 'security',
              },
              {
                filename: 'guardian-site-result.json',
                title: '[Guardian] Live website and asset availability',
                label: 'site-monitor',
              },
            ];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: 'guardian-monitor', state: 'all', per_page: 100,
            });
            for (const category of categories) {
              if (!fs.existsSync(category.filename)) continue;
              const report = JSON.parse(fs.readFileSync(category.filename, 'utf8'));
              const issue = existing.find(x => x.title === category.title && !x.pull_request);
              const bad = report.status === 'FAIL' || report.status === 'UNKNOWN';
              const body = [
                'Automated KIFARO Guardian finding. Do not publish or change billing/security rules without owner approval.',
                '',
                'Status: **' + report.status + '**',
                'Run: ' + context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId,
                '',
                '```json',
                JSON.stringify(report, null, 2).slice(0, 16000),
                '```',
                '',
                'Add a regression test to any approved fix. Close only when a later check confirms recovery.',
              ].join('\n');
              if (bad) {
                if (issue) {
                  await github.rest.issues.update({ owner, repo, issue_number: issue.number, body, state: 'open' });
                } else {
                  await github.rest.issues.create({
                    owner, repo, title: category.title, body,
                    labels: ['guardian-monitor'],
                  });
                }
              } else if (issue?.state === 'open') {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Guardian recovery confirmed in run ' + context.runId + '. Status: ' + report.status,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
            }

      - name: Keep machine-readable audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report-${{ github.run_id }}
          path: |
            guardian-audit-result.json
            guardian-site-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce dependency security on every PR and run
        if: ${{ always() && steps.node_runtime.outcome == 'success' }}
        run: node scripts/guardian/assert-reports.mjs guardian-audit-result.json

      - name: Enforce live-site checks when applicable
        if: ${{ always() && steps.node_runtime.outcome == 'success' && github.event_name != 'pull_request' }}
        run: node scripts/guardian/assert-reports.mjs guardian-site-result.json
