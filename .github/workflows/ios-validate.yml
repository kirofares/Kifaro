name: Validate AnatoMate iOS

on:
  workflow_dispatch:
  # Validate runtime/workflow edits before merge without signing or deployment.
  pull_request:
    paths:
      - '.github/workflows/ios-validate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-validate.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-check:
    runs-on: macos-latest
    env:
      VITE_SUPABASE_URL: https://gwwauaybbqmzbwvpbxly.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_4Iw4ogv0H0YgGA3sehrjjw_bjWcBcgS
      # Shows the Paymob sandbox notice at checkout; set to 'false' when live payments are enabled.
      VITE_PAYMOB_TEST_MODE: 'true'
      VITE_APP_VERSION: 1.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # October 2026 security release; update the assertion with future pins.
          node-version: '22.23.4'

      - name: Verify patched Node runtime
        run: |
          node --version
          node -e "require('node:assert/strict').equal(process.versions.node, '22.23.4')"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Validate Xcode project
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -sdk iphonesimulator             -configuration Debug             CODE_SIGNING_ALLOWED=NO             build
