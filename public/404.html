<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnatoMate by KIFARO</title>
</head>
<body>
<script>
  // GitHub Pages SPA fallback: remember the requested route, load the app root,
  // then index.html restores the original URL before React Router starts.
  try {
    sessionStorage.setItem('kifaro-spa-redirect', location.pathname + location.search + location.hash);
  } catch (_) {}
  location.replace('/');
</script>
</body>
</html>
