<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760"><rect width="1300" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Early Maternal–Fetal Exchange</text><g transform="translate(150,150)"><rect x="0" y="0" width="900" height="420" rx="28" fill="#fff" stroke="#cbdde5" stroke-width="4"/><rect x="60" y="60" width="780" height="100" rx="30" fill="#f8d6d6"/><rect x="60" y="260" width="780" height="100" rx="30" fill="#dcecf8"/><g fill="#ef4444"><circle cx="200" cy="110" r="18"/><circle cx="320" cy="110" r="18"/><circle cx="440" cy="110" r="18"/><circle cx="560" cy="110" r="18"/></g><g stroke="#7c3aed" stroke-width="16"><path d="M260 180 V240"/><path d="M500 180 V240"/><path d="M700 180 V240"/></g><g fill="#0ea5e9"><circle cx="260" cy="210" r="11"/><circle cx="500" cy="210" r="11"/><circle cx="700" cy="210" r="11"/></g><g font-family="Arial" font-size="24" font-weight="700" fill="white"><circle cx="1030" cy="140" r="30" fill="#ef4444"/><text x="1020" y="149">1</text><circle cx="1030" cy="330" r="30" fill="#0ea5e9"/><text x="1020" y="339">2</text></g></g><text x="55" y="705" font-family="Arial" font-size="18" fill="#6b7f8c">Maternal blood surrounds villi; fetal capillaries within tertiary villi enable exchange without direct blood mixing.</text></svg>