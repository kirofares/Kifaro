<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Human Development Timeline — Exam Visual</text><line x1="120" y1="320" x2="1280" y2="320" stroke="#8fa5b4" stroke-width="10"/><rect x="180" y="240" width="330" height="160" rx="25" fill="#f4bfd3"/><rect x="525" y="240" width="650" height="160" rx="25" fill="#c7e9ef"/><g font-family="Arial" font-size="25" fill="#284554"><text x="205" y="295">Period 1</text><text x="205" y="345">Weeks 1-8</text><text x="555" y="295">Period 2</text><text x="555" y="345">Week 9 → birth</text></g><g fill="#0ea5e9"><circle cx="120" cy="320" r="18"/><circle cx="510" cy="320" r="18"/><circle cx="1280" cy="320" r="18"/></g><g font-family="Arial" font-size="22" fill="#557080"><text x="85" y="455">Fertilization</text><text x="430" y="455">Major organogenesis largely established</text><text x="1195" y="455">Birth</text></g><text x="55" y="640" font-family="Arial" font-size="18" fill="#6b7f8c">Use timing to distinguish organogenesis-dominant and growth/differentiation-dominant periods.</text></svg>