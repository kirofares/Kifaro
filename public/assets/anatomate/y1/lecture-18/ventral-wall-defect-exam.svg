<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760"><rect width="1350" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Ventral Body Wall — Closure Defect</text><g transform="translate(100,150)"><rect width="520" height="390" rx="24" fill="#fff" stroke="#cbdde5" stroke-width="4"/><ellipse cx="260" cy="200" rx="140" ry="110" fill="#efd1df" stroke="#8b5e77" stroke-width="8"/><line x1="260" y1="90" x2="260" y2="310" stroke="#14b8a6" stroke-width="14"/><text x="220" y="350" font-family="Arial" font-size="26" fill="#284554">Normal</text><rect x="650" width="520" height="390" rx="24" fill="#fff" stroke="#cbdde5" stroke-width="4"/><ellipse cx="910" cy="200" rx="140" ry="110" fill="#efd1df" stroke="#8b5e77" stroke-width="8"/><path d="M910 125 Q850 200 910 275" fill="none" stroke="#ef4444" stroke-width="16"/><circle cx="910" cy="200" r="42" fill="#fff4d6" stroke="#ef4444" stroke-width="8"/><text x="870" y="350" font-family="Arial" font-size="26" fill="#284554">Defect</text></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Abnormal lateral folding or incomplete ventral closure can produce congenital body-wall defects.</text></svg>