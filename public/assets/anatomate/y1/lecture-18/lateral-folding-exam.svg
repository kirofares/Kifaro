<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760"><rect width="1350" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Lateral Folding — Ventral Closure</text><g transform="translate(120,150)"><ellipse cx="360" cy="220" rx="280" ry="115" fill="#eef9fb" stroke="#0ea5e9" stroke-width="8"/><path d="M120 180 Q200 320 360 360 Q520 320 600 180" fill="none" stroke="#7c3aed" stroke-width="26"/><path d="M95 160 Q170 260 260 285 M625 160 Q550 260 460 285" fill="none" stroke="#14b8a6" stroke-width="10"/><circle cx="360" cy="325" r="48" fill="#fff4d6" stroke="#f0d85a" stroke-width="8"/><g font-family="Arial" font-size="24" font-weight="700" fill="white"><circle cx="900" cy="180" r="30" fill="#0ea5e9"/><text x="890" y="189">1</text><circle cx="900" cy="315" r="30" fill="#14b8a6"/><text x="890" y="324">2</text><circle cx="900" cy="450" r="30" fill="#7c3aed"/><text x="890" y="459">3</text></g></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Paired lateral folds move ventrally, enclosing gut and closing most of the ventral body wall around the umbilical ring.</text></svg>