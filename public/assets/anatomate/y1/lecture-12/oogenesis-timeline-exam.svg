<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 760"><rect width="1450" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Oogenesis — Timing & Arrests</text><line x1="120" y1="330" x2="1320" y2="330" stroke="#8fa5b4" stroke-width="10"/><g fill="#f4bfd3"><circle cx="210" cy="330" r="55"/><circle cx="540" cy="330" r="55"/><circle cx="860" cy="330" r="55"/><circle cx="1160" cy="330" r="55"/></g><g font-family="Arial" font-size="22" fill="#284554"><text x="145" y="430">Fetal life</text><text x="470" y="430">Puberty / cycle</text><text x="805" y="430">Ovulation</text><text x="1080" y="430">If fertilization occurs</text></g><path d="M210 250 V190 M540 250 V190 M860 250 V190 M1160 250 V190" stroke="#0ea5e9" stroke-width="7"/><g font-family="Arial" font-size="24" font-weight="700" fill="white"><circle cx="210" cy="160" r="30" fill="#0ea5e9"/><text x="200" y="169">1</text><circle cx="540" cy="160" r="30" fill="#14b8a6"/><text x="530" y="169">2</text><circle cx="860" cy="160" r="30" fill="#7c3aed"/><text x="850" y="169">3</text><circle cx="1160" cy="160" r="30" fill="#ef4444"/><text x="1150" y="169">4</text></g><text x="55" y="665" font-family="Arial" font-size="18" fill="#6b7f8c">Primary oocyte begins before birth; meiosis I completes before ovulation; meiosis II completes only after fertilization.</text></svg>