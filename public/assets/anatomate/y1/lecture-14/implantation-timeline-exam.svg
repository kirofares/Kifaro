<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 760"><rect width="1450" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">First Week & Implantation — Timeline</text><line x1="120" y1="330" x2="1320" y2="330" stroke="#8fa5b4" stroke-width="10"/><g fill="#0ea5e9"><circle cx="140" cy="330" r="18"/><circle cx="365" cy="330" r="18"/><circle cx="590" cy="330" r="18"/><circle cx="815" cy="330" r="18"/><circle cx="1040" cy="330" r="18"/><circle cx="1265" cy="330" r="18"/></g><g font-family="Arial" font-size="21" fill="#284554"><text x="90" y="405">Day 0</text><text x="305" y="405">~30 h</text><text x="535" y="405">~Day 3</text><text x="755" y="405">~Day 4</text><text x="980" y="405">~Day 5</text><text x="1205" y="405">~Day 6</text><text x="70" y="455">fertilization</text><text x="280" y="455">cleavage</text><text x="535" y="455">morula</text><text x="740" y="455">uterine entry</text><text x="980" y="455">blastocyst</text><text x="1180" y="455">implantation begins</text></g><rect x="1070" y="130" width="250" height="95" rx="25" fill="#f5d7e4" stroke="#8b5e77" stroke-width="5"/><circle cx="1130" cy="177" r="34" fill="#c7e9ef" stroke="#0ea5e9" stroke-width="5"/><text x="55" y="690" font-family="Arial" font-size="18" fill="#6b7f8c">Implantation normally starts around day 6 at the embryonic pole in upper uterine body endometrium.</text></svg>