<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760"><rect width="1300" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Multifactorial Causation — Gene × Environment</text><g transform="translate(180,160)"><circle cx="320" cy="220" r="150" fill="#d7c9f4" fill-opacity=".78"/><circle cx="540" cy="220" r="150" fill="#f4bfd3" fill-opacity=".78"/><text x="265" y="220" font-family="Arial" font-size="28" fill="#284554">Genetic</text><text x="500" y="220" font-family="Arial" font-size="28" fill="#284554">Environment</text><text x="405" y="255" font-family="Arial" font-size="27" font-weight="700" fill="#0b2a3d">Risk</text><path d="M690 220 H850" stroke="#0ea5e9" stroke-width="10"/><rect x="870" y="155" width="230" height="130" rx="24" fill="#fff" stroke="#cbdde5" stroke-width="4"/><text x="985" y="210" font-family="Arial" font-size="25" fill="#284554" text-anchor="middle">Congenital</text><text x="985" y="245" font-family="Arial" font-size="25" fill="#284554" text-anchor="middle">phenotype</text></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Many birth defects reflect combined genetic susceptibility and environmental influence.</text></svg>