<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760"><rect width="1300" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Nondisjunction & Aneuploidy</text><g transform="translate(130,160)"><circle cx="160" cy="160" r="70" fill="#d7c9f4"/><g stroke="#7c3aed" stroke-width="10"><line x1="135" y1="125" x2="165" y2="165"/><line x1="165" y1="125" x2="135" y2="165"/><line x1="180" y1="125" x2="210" y2="165"/><line x1="210" y1="125" x2="180" y2="165"/></g><path d="M250 160 H400" stroke="#ef4444" stroke-width="10"/><polygon points="400,160 370,140 370,180" fill="#ef4444"/><circle cx="520" cy="110" r="55" fill="#f4bfd3"/><circle cx="520" cy="260" r="55" fill="#f4bfd3"/><path d="M465 110 H400 M575 260 H650" stroke="#0ea5e9" stroke-width="8"/><g font-family="Arial" font-size="24" fill="#284554"><text x="760" y="130">one gamete: n+1</text><text x="760" y="285">one gamete: n−1</text></g><circle cx="1050" cy="140" r="30" fill="#0ea5e9"/><text x="1040" y="149" font-family="Arial" font-size="24" fill="white">1</text><circle cx="1050" cy="290" r="30" fill="#14b8a6"/><text x="1040" y="299" font-family="Arial" font-size="24" fill="white">2</text></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Failure of chromosome separation can produce trisomy or monosomy after fertilization.</text></svg>