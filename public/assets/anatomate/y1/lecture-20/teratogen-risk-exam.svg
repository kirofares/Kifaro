<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760"><rect width="1350" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Teratogenic Risk — Not Binary</text><g transform="translate(120,150)"><rect x="0" y="0" width="980" height="420" rx="28" fill="#fff" stroke="#cbdde5" stroke-width="4"/><g fill="#c7e9ef"><rect x="90" y="70" width="180" height="80" rx="20"/><rect x="400" y="70" width="180" height="80" rx="20"/><rect x="710" y="70" width="180" height="80" rx="20"/><rect x="245" y="250" width="180" height="80" rx="20"/><rect x="555" y="250" width="180" height="80" rx="20"/></g><g font-family="Arial" font-size="24" fill="#284554"><text x="135" y="120">timing</text><text x="455" y="120">dose</text><text x="750" y="120">duration</text><text x="285" y="300">agent</text><text x="590" y="300">genotype</text></g><circle cx="900" cy="210" r="48" fill="#ef4444"/><text x="875" y="220" font-family="Arial" font-size="26" fill="white">risk</text></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Developmental risk depends on timing, dose, duration, specific agent and maternal/fetal susceptibility.</text></svg>