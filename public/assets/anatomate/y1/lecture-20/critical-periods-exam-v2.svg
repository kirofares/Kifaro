<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Critical Periods in Human Development</text><line x1="120" y1="330" x2="1380" y2="330" stroke="#8fa5b4" stroke-width="10"/><rect x="140" y="245" width="260" height="170" rx="25" fill="#d7c9f4"/><rect x="410" y="245" width="460" height="170" rx="25" fill="#f4bfd3"/><rect x="880" y="245" width="400" height="170" rx="25" fill="#c7e9ef"/><g font-family="Arial" font-size="24" fill="#284554"><text x="185" y="305">Weeks 0–2</text><text x="500" y="305">Weeks 3–8/9</text><text x="980" y="305">Fetal period</text><text x="165" y="360">all-or-none tendency</text><text x="475" y="360">major structural defects</text><text x="940" y="360">growth / functional effects</text></g><g font-family="Arial" font-size="22" fill="#557080"><text x="120" y="470">fertilization</text><text x="390" y="470">organogenesis</text><text x="850" y="470">week 9</text><text x="1280" y="470">birth</text></g><text x="55" y="690" font-family="Arial" font-size="18" fill="#6b7f8c">Risk depends strongly on developmental timing; CNS remains vulnerable for a prolonged period.</text></svg>