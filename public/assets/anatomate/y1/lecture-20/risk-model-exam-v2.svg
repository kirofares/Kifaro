<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Teratogenic Risk Model — Exam Visual</text><g transform="translate(180,160)"><circle cx="220" cy="220" r="115" fill="#f7c9c9" fill-opacity=".85"/><circle cx="390" cy="220" r="115" fill="#d9edf7" fill-opacity=".85"/><circle cx="305" cy="360" r="115" fill="#f8e5b8" fill-opacity=".85"/><text x="145" y="215" font-family="Arial" font-size="28" fill="#284554">Timing</text><text x="375" y="215" font-family="Arial" font-size="28" fill="#284554">Dose</text><text x="245" y="390" font-family="Arial" font-size="28" fill="#284554">Genotype</text><circle cx="780" cy="280" r="55" fill="#7c3aed"/><text x="758" y="290" font-family="Arial" font-size="26" fill="white">Risk</text><path d="M505 265 H710" stroke="#0ea5e9" stroke-width="10"/><polygon points="710,265 680,245 680,285" fill="#0ea5e9"/></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Teratogenic risk is graded, not binary: timing × dose/duration × maternal/fetal susceptibility × specific agent.</text></svg>