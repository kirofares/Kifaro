<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 760"><rect width="1450" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Nondisjunction → Aneuploidy</text><g transform="translate(90,150)"><circle cx="180" cy="170" r="70" fill="#d7c9f4"/><g stroke="#7c3aed" stroke-width="10"><line x1="155" y1="140" x2="180" y2="175"/><line x1="180" y1="140" x2="155" y2="175"/><line x1="195" y1="140" x2="220" y2="175"/><line x1="220" y1="140" x2="195" y2="175"/></g><path d="M260 170 H430" stroke="#0ea5e9" stroke-width="10"/><circle cx="560" cy="120" r="55" fill="#f4bfd3"/><circle cx="560" cy="250" r="55" fill="#f4bfd3"/><path d="M640 120 H800 M640 250 H800" stroke="#14b8a6" stroke-width="10"/><circle cx="930" cy="120" r="48" fill="#fff4d6"/><circle cx="930" cy="250" r="48" fill="#fff4d6"/><g font-family="Arial" font-size="24" fill="#284554"><text x="855" y="355">extra chromosome → trisomy</text><text x="855" y="400">missing chromosome → monosomy</text></g></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Failure of chromosome separation during gametogenesis can produce aneuploid gametes.</text></svg>