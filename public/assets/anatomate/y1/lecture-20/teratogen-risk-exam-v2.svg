<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 760"><rect width="1350" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Teratogenic Risk — Four Determinants</text><g transform="translate(180,150)"><circle cx="480" cy="230" r="110" fill="#eef9fb" stroke="#0ea5e9" stroke-width="8"/><text x="420" y="240" font-family="Arial" font-size="30" fill="#284554">Outcome</text><g fill="#fff" stroke="#cbdde5" stroke-width="4"><rect x="20" y="40" width="250" height="95" rx="20"/><rect x="690" y="40" width="250" height="95" rx="20"/><rect x="20" y="330" width="250" height="95" rx="20"/><rect x="690" y="330" width="250" height="95" rx="20"/></g><g font-family="Arial" font-size="25" fill="#284554"><text x="95" y="100">Timing</text><text x="760" y="100">Dose / duration</text><text x="60" y="390">Specific agent</text><text x="735" y="390">Genetic susceptibility</text></g><g stroke="#14b8a6" stroke-width="8"><line x1="270" y1="90" x2="395" y2="180"/><line x1="690" y1="90" x2="565" y2="180"/><line x1="270" y1="375" x2="395" y2="280"/><line x1="690" y1="375" x2="565" y2="280"/></g></g><text x="55" y="690" font-family="Arial" font-size="18" fill="#6b7f8c">Teratogenic risk is not binary; outcome reflects timing, dose, agent, and maternal/fetal genotype.</text></svg>