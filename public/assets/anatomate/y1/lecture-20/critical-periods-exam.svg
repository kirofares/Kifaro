<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Critical Periods of Development</text><line x1="120" y1="330" x2="1360" y2="330" stroke="#8fa5b4" stroke-width="10"/><rect x="130" y="230" width="250" height="160" rx="25" fill="#f7d6d6"/><rect x="395" y="230" width="430" height="160" rx="25" fill="#f6c4d8"/><rect x="840" y="230" width="470" height="160" rx="25" fill="#c7e9ef"/><g font-family="Arial" font-size="24" fill="#284554"><text x="180" y="295">Weeks 1–2</text><text x="165" y="345">all-or-none tendency</text><text x="505" y="295">Weeks 3–8/9</text><text x="455" y="345">major structural malformations</text><text x="970" y="295">Fetal period</text><text x="900" y="345">growth & functional effects</text></g><text x="55" y="700" font-family="Arial" font-size="18" fill="#6b7f8c">Timing of exposure strongly influences the pattern of developmental injury.</text></svg>