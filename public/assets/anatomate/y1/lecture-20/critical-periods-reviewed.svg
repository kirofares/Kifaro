<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760"><rect width="1500" height="760" fill="#f8fbfd"/><text x="55" y="65" font-family="Arial" font-size="36" font-weight="700" fill="#0b2a3d">Critical Periods of Development</text><line x1="110" y1="330" x2="1370" y2="330" stroke="#8fa5b4" stroke-width="10"/><rect x="120" y="230" width="210" height="150" rx="24" fill="#d7c9f4"/><rect x="350" y="205" width="410" height="200" rx="24" fill="#f4bfd3"/><rect x="780" y="230" width="520" height="150" rx="24" fill="#c7e9ef"/><g font-family="Arial" fill="#284554"><text x="155" y="285" font-size="26">0–2 weeks</text><text x="160" y="335" font-size="22">all-or-none tendency</text><text x="440" y="270" font-size="28">weeks 3–8/9</text><text x="430" y="325" font-size="22">organogenesis</text><text x="425" y="365" font-size="22">major structural defects</text><text x="960" y="285" font-size="28">fetal period</text><text x="900" y="335" font-size="22">growth & functional maturation</text></g><text x="55" y="690" font-family="Arial" font-size="18" fill="#6b7f8c">Timing strongly influences the pattern of developmental injury.</text></svg>